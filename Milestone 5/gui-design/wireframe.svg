<text x="20" y="908" font-size="17" font-weight="700">Design notes - outside the application window</text>
<text x="20" y="936" >Inactive example: Stop and READ controls are disabled. Run executes the selected tab, including unsaved edits.</text>
<text x="20" y="960" >New/Open add tabs; Close tab prompts for unsaved changes. Conversion saves a new file and opens its tab.</text>
<text x="20" y="984" >Running or waiting for READ locks editing, file actions, and tab switching. Memory addresses are 000-249.</text>
<text x="20" y="1008" >Default green #4C721D / white #FFFFFF are configurable RGB hex colors. Widget metrics vary with display scaling.</text>
</g></svg>
