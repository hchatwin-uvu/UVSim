<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><rect width="1000" height="650" fill="white"/><rect x="20" y="20" width="570" height="90" fill="#4C721D" stroke="#4C721D"/><text x="36" y="52" font-family="Segoe UI, sans-serif" font-size="18" fill="#FFFFFF">UVSim / BasicML simulator</text><text x="610" y="52" font-family="Segoe UI, sans-serif" font-size="15" fill="#182113">1. UVU green/white; configurable in theme.ini</text><rect x="20" y="120" width="570" height="50" fill="#FFFFFF" stroke="#4C721D"/><text x="36" y="152" font-family="Segoe UI, sans-serif" font-size="18" fill="#182113">Open file     Run     Stop</text><text x="610" y="152" font-family="Segoe UI, sans-serif" font-size="15" fill="#182113">2. Run resets memory and output for each run</text><rect x="20" y="180" width="570" height="55" fill="#FFFFFF" stroke="#4C721D"/><text x="36" y="212" font-family="Segoe UI, sans-serif" font-size="18" fill="#182113">Selected File Name: programs/Test1.txt</text><text x="610" y="212" font-family="Segoe UI, sans-serif" font-size="15" fill="#182113">3. Explicit label for the loaded path</text><rect x="20" y="245" width="570" height="45" fill="#FFFFFF" stroke="#4C721D"/><text x="36" y="277" font-family="Segoe UI, sans-serif" font-size="18" fill="#182113">Status: Input a word (-9999 to 9999)</text><text x="610" y="277" font-family="Segoe UI, sans-serif" font-size="15" fill="#182113">4. Status above READ and output</text><rect x="20" y="300" width="570" height="60" fill="#FFFFFF" stroke="#4C721D"/><text x="36" y="332" font-family="Segoe UI, sans-serif" font-size="18" fill="#182113">READ input [                    ]  Submit input</text><text x="610" y="332" font-family="Segoe UI, sans-serif" font-size="15" fill="#182113">5. Submit or Enter; enabled only at READ</text><rect x="20" y="370" width="570" height="200" fill="#FFFFFF" stroke="#4C721D"/><text x="36" y="402" font-family="Segoe UI, sans-serif" font-size="18" fill="#182113">Program output (scrollable, read-only)</text><text x="610" y="402" font-family="Segoe UI, sans-serif" font-size="15" fill="#182113">6. Retained after HALT/Stop; clears on Run</text><text x="20" y="625" font-family="Segoe UI, sans-serif" font-size="16">Current WP-1 layout. Editor and Save/Save As integration remains pending.</text></svg>