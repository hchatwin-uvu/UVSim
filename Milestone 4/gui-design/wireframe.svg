<text x="20" y="785" font-size="17" font-weight="700">Design notes — outside the application window</text>
<g font-size="13">
<text x="20" y="812">Initial empty state: Stop, READ input, and Submit input are disabled; source and output are empty.</text>
<text x="20" y="836">Toolbar order and two-column layout match the supplied GUI. Run executes current editor contents.</text>
<text x="20" y="860">Open/Close offer Save, Discard, or Cancel for unsaved edits. File dialogs use the operating-system design.</text>
<text x="20" y="884">Green #4C721D / white #FFFFFF are configurable. Widget metrics and scrollbars vary with display scaling.</text>
</g></g></svg>